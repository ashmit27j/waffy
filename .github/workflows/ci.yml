name: CI

on:
  push:
    branches: [main]
  pull_request:

# waffy's IPC layer requires socket.AF_UNIX (asyncio.start_unix_server) --
# see README.md's Prerequisites section and docs/DEPLOYMENT.md's platform
# note. This is unrelated to standalone TLS mode's separate socket.MSG_PEEK
# Linux dependency -- both point at "run this on Linux", never Windows.
jobs:
  test:
    name: ruff / pyright / pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra ml --python ${{ matrix.python-version }}

      - name: ruff check
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

      - name: pytest (with coverage floor)
        run: uv run pytest --cov=waffy --cov-report=term-missing -q

  dependency-audit:
    name: pip-audit (known-vulnerable dependency scan)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra ml

      # pip-audit run against the already-synced environment (not a fresh
      # `--requirement` resolve into a new venv -- that path needs
      # ensurepip/python3-venv, which isn't guaranteed present) so it scans
      # exactly what uv.lock actually resolved and installed. `waffy` itself
      # is skipped as "not found on PyPI" -- expected, it's this repo, not a
      # scan target.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit
