[project]
name = "waffy"
version = "0.1.0"
description = "A standalone, per-host application-layer Web Application Firewall"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "tomli>=1.2.0; python_version < '3.11'",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
# Minimal startup-checks entrypoint only -- see waffy/runtime/__main__.py's
# module docstring for exactly what this does and doesn't do yet.
waffy-core = "waffy.runtime.__main__:main"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pyright>=1.1.365",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["waffy", "tests"]
exclude = ["**/__pycache__", ".venv"]
reportMissingTypeStubs = false
# FastAPI route handler functions are registered via @app.get/post decorators
# and are therefore not "called" directly — suppress the false positive.
reportUnusedFunction = false
# Starlette's TestClient wraps httpx without stubs; response members are Unknown.
# These suppressions only affect test files (source code doesn't trigger them).
reportUnknownVariableType = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "tls_integration: real TLS handshake against a bound loopback socket (requires openssl CLI on PATH)",
]
