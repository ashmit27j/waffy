# waffy Default Configuration
# All security defaults follow CLAUDE.md:
# - Enforcement mode defaults to SHADOW (observe/log only, no blocking)
# - Failure mode defaults to fail_open (pass traffic on internal error)
# - No hardcoded secrets or production endpoints

[transport]
# Listener binding mode: "standalone_tls", "plaintext", or "embedded"
mode = "plaintext"
host = "127.0.0.1"
port = 8080
# Upstream target application
upstream_url = "http://127.0.0.1:8000"
# Maximum concurrent connections
max_connections = 1000
# Connection timeout in seconds
timeout_seconds = 30.0

[http]
# Maximum request line length (bytes)
max_request_line_bytes = 8192
# Maximum total header size (bytes)
max_header_bytes = 65536
# Maximum header count
max_header_count = 100
# Maximum request body size (bytes)
max_body_bytes = 10485760 # 10 MB
# Maximum decompressed body size (bytes)
max_decompressed_body_bytes = 20971520 # 20 MB
# Maximum decompression ratio before triggering bomb guard
max_decompression_ratio = 10.0
# Normalization max decode passes
max_decode_passes = 5

[detection]
# CRS Paranoia Level: 1 (low FP, default), 2, 3, 4
paranoia_level = 1
# Enabled detection categories
enabled_categories = [
    "sqli",
    "xss",
    "command_injection",
    "path_traversal",
    "lfi_rfi",
    "ssti",
    "xxe",
    "deserialization",
    "crlf_injection",
    "open_redirect",
    "ssrf",
    "scanner_fingerprint"
]
# Rules directory path
rules_dir = "config/rules"
# Per-request regex matching time budget in milliseconds
regex_budget_ms = 50.0

[anomaly]
# Enable ML anomaly scoring layer
enabled = true
# Minimum sample count before route model is trusted for scoring
min_sample_size = 100
# Model artifacts storage directory
model_dir = "config/models"
# Anomaly score threshold for high anomaly flag (0.0 - 1.0)
anomaly_threshold = 0.75

[ratelimit]
# Enable rate limiting
enabled = true
# Default per-IP requests per minute
requests_per_minute_ip = 120
# Default per-session requests per minute
requests_per_minute_session = 300
# Global requests per minute circuit-breaker limit
requests_per_minute_global = 10000
# Rate limit window in seconds
window_seconds = 60

# Section name must match WaffyConfig's Pydantic field name (`bot_detection`),
# not the class name (`BotDetectionConfig`) -- see prompts/11 and
# docs/ARCHITECTURE.md's "Config section-name mismatches" note. A section
# named anything else is silently ignored by WaffyConfig.model_validate()
# and BotDetectionConfig()'s hardcoded defaults are used instead, with no
# error raised.
[bot_detection]
# Enable bot heuristics
enabled = true
# Honeypot link paths (a request to any of these is a scraper/bot signal)
honeypot_endpoints = ["/.well-known/waffy-trap", "/admin/hidden-trap.php"]
# Known scanner user-agent scoring weight
scanner_weight = 25.0
# Timing regularity CV threshold
timing_regularity_threshold = 0.15
# Locally-managed list of known-bad TLS ClientHello fingerprints (JA3/waffy-tlsfp-v1);
# empty by default, not a live threat-intel feed -- see BotDetectionConfig's docstring.
known_bad_tls_fingerprints = []

[engine]
# Base scoring weights
weight_signature_p1 = 5.0
weight_signature_p2 = 10.0
weight_signature_p3 = 15.0
weight_signature_p4 = 20.0
weight_positive_violation = 5.0
weight_anomaly = 10.0
weight_bot = 10.0
weight_rate_limit = 15.0
weight_csrf_violation = 10.0
weight_credential_stuffing = 15.0
# Threat level score thresholds
threshold_low = 5.0
threshold_medium = 15.0
threshold_high = 25.0
threshold_critical = 40.0
# Consecutive ambiguous signals required for escalation
consecutive_escalation_count = 3

[enforcement]
# Enforcement mode: "shadow" (default), "assisted", "active"
mode = "shadow"
# Failure mode: "fail_open" (default), "fail_closed"
failure_mode = "fail_open"
# Default block status code
block_status_code = 403
# Maximum persistent bans created per hour rate-cap
max_bans_per_hour = 50
# Default temporary ban duration in seconds
default_ban_duration_seconds = 3600

[allowlist]
# Static admin-defined IP/CIDR allowlist (outranks all adaptive decisions)
ips = [
    "127.0.0.1",
    "::1"
]

[api]
# Management API host and port (waffy-api process)
host = "127.0.0.1"
port = 9090
# Allowed CIDRs for management API access
management_cidrs = [
    "127.0.0.1/32",
    "::1/128"
]
# API authentication token (MUST be configured by operator in production)
api_token = "CHANGE_ME"
# IPC socket path for core <-> api communication
ipc_socket_path = "/tmp/waffy_ipc.sock"

[integration]
# Enable SIEM event forwarding
siem_enabled = false
# SIEM syslog/json endpoint host and port
siem_host = "127.0.0.1"
siem_port = 514
siem_protocol = "udp"
# Enable metrics endpoint
metrics_enabled = true
metrics_port = 9100

[logging]
# Redaction field-name denylist (values masked in logs)
redact_fields = [
    "password",
    "passwd",
    "token",
    "secret",
    "authorization",
    "cookie",
    "set-cookie",
    "api_key",
    "apikey",
    "access_token",
    "refresh_token"
]
log_level = "INFO"
